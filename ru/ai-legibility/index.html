<article>
  <div class="kicker">Каноническое определение</div>
  <h1>AI legibility</h1>
  <p class="subtitle">Справочный документ по дисциплине: что она охватывает, где проходят её границы, как её практикуют и как измеряют. Версионированный, датированный, поддерживаемый.</p>
  <div class="meta">Версия 1.0 · Опубликовано 5 августа 2026 · Ведёт Екатерина Шалель, founder and legibility strategist</div>

  <p>Это исходный документ по тому, как я использую термин. Он появился потому, что у работы набралось достаточно частей, и показывать на эссе по одному больше не объясняет целого. Эссе спорят. Здесь определяют. Когда определение меняется, номер версии сдвигается, а изменение фиксируется внизу страницы, чтобы читатель или модель всегда могли понять, из какой версии взято утверждение.</p>

  <div class="term" id="definition">
    <h2>1. Определение</h2>
    <p><strong>AI legibility это практика, которая делает человека, продукт или компанию читаемыми, проверяемыми и цитируемыми для AI-систем, чтобы описание, которое эти системы порождают, совпадало с тем, чем сущность является на самом деле.</strong></p>
    <p>Три слова здесь несут вес. <em>Читаемость</em>: машина разбирает, чем вы являетесь, а не достраивает это догадкой. <em>Проверяемость</em>: утверждение выдерживает сверку с источниками, которыми вы не управляете. <em>Цитируемость</em>: система возвращает вас как ответ, а не просто находит в индексе.</p>
    <p>Дисциплина занимается не отсутствием, а неверным описанием. Компания, о которой ни одна модель не слышала, имеет проблему обнаружения. Компания, которую каждая модель описывает как то, чем она перестала быть три года назад, имеет проблему legibility, и её не решает никакой дополнительный объём публикаций, если само описание нигде не приведено к одному виду.</p>
  </div>

  <div class="term" id="distinction">
    <h2>2. Важное различение: не та legibility, о которой говорят инвесторы</h2>
    <p>В венчурном лексиконе слово legibility уже занято. Там оно означает понятность компании человеку: инвестор быстро видит, что делает бизнес, как зарабатывает, кто команда, какие риски. Разделяют extrinsic legibility, то есть социальные сигналы вроде бренда и акселераторов, и intrinsic legibility, то есть метрики, которые говорят сами за себя.</p>
    <p>Это полезная рамка, и она про другого читателя.</p>
    <p>Там задача убедить человека, у которого мало времени. Здесь задача быть корректно извлечённым машиной, которая читает за человека, разрешает противоречия между источниками и выдаёт одно описание без списка ссылок. Убедительность не помогает, если система вас не нашла. Красивый нарратив не помогает, если ваш сайт, ваша пресса и ваш профиль описывают вас по-разному, потому что подтверждать в этом случае нечего.</p>
    <p>Пересечение есть: и там, и там выигрывает согласованность. Инструменты не переносятся.</p>
  </div>

  <div class="term" id="origin">
    <h2>3. Почему дисциплина возникла</h2>
    <p>Примерно двадцать пять лет интерфейсом между компанией и незнакомым человеком был ранжированный список ссылок. Человек сам читал, сравнивал и решал. Оптимизация означала попасть в список и подняться в нём.</p>
    <p>Этот интерфейс заменяется сгенерированным ответом. Система читает источники, разрешает противоречия между ними и выдаёт человеку одно описание, без списка. Чтение больше не делает человек. Его один раз делает модель, за сущность, и результат этого чтения человек и видит.</p>
    <p>Точка отказа сместилась. Раньше она была на ранжировании. Теперь она на описании. Отсюда два следствия. Первое: сущность может быть хорошо освещена и при этом плохо описана, потому что охват и подтверждение это разные вещи. Второе: описание собирается заново при каждом запросе из того, что систему удалось извлечь и подтвердить, а значит оно поддаётся сопровождению так, как никогда не поддавалась репутация, и распадается так, как репутация не распадается.</p>
  </div>

  <div class="term" id="boundaries">
    <h2>4. Чем AI legibility не является</h2>
    <p><strong>Не SEO.</strong> SEO оптимизирует позицию в списке ссылок. Legibility оптимизирует точность и атрибуцию внутри сгенерированного ответа, где списка нет. Пересекаются по инфраструктуре, расходятся по цели.</p>
    <p><strong>Не GEO и не AEO.</strong> Они рассматривают AI-поверхности как новый канал размещения и спрашивают, как в них попасть. Полезная работа, более узкий вопрос. Legibility спрашивает, разрешается ли сущность одинаково в разных системах, а это определяет, что вообще может там появиться.</p>
    <p><strong>Не entity SEO.</strong> Ближайший сосед и самый полезный. Занимается присутствием в графе знаний, разметкой и разрешением неоднозначности. Legibility берёт это как один слой из четырёх и добавляет то, чего там нет: независимое подтверждение как обязательное требование и вызываемость агентами, а не только описанность для людей.</p>
    <p><strong>Не PR.</strong> PR производит охват. Охват это вход, а не замена. Статья, описывающая компанию иначе, чем её собственный сайт, добавляет не подтверждение, а противоречие, и система взвесит именно расхождение, а не объём.</p>
    <p><strong>Не бренд и не репутация.</strong> Обе про то, что чувствуют люди. Legibility про то, что может доказать машина.</p>
    <p><strong>Не только работа с графом знаний.</strong> Запись в графе это один артефакт из нескольких, со своими правилами значимости и своими задержками. Если считать её целью, получаются долгие периоды, когда делать нечего.</p>
  </div>

  <div class="term" id="layers">
    <h2>5. Четыре слоя</h2>
    <p>Дисциплина раскладывается на четыре слоя. Они упорядочены, и каждый почти ничего не стоит без предыдущего.</p>
    <p><strong>Слой первый, находимость.</strong> Система вообще может что-то о вас извлечь. Проиндексированные страницы, доступные для обхода поверхности, канонический дом, который разрешается.</p>
    <p><strong>Слой второй, читаемость.</strong> То, что извлечено, однозначно. Одно самоописание, дословно одинаковое на всех поверхностях, которыми вы управляете. Структурированные данные, которые говорят машине, чем вы являетесь, вместо того чтобы оставлять это выводу. Устойчивый идентификатор, чтобы сущность не распадалась на варианты имени.</p>
    <p><strong>Слой третий, цитируемость.</strong> Источники, которыми вы не управляете, говорят то же самое. Этот слой чаще всего пропускают, и именно он превращает присутствие в цитирование. Расстояние между «о вас написали» и «вас подтвердили» я называю <a href="/ru/guides/dictionary/">corroboration gap</a>.</p>
    <p><strong>Слой четвёртый, вызываемость.</strong> Агенты могут не только описать вас, но и вызвать, через опубликованное объявление того, что вы делаете, где находится точка входа и где заканчивается ваша ответственность. Самый новый слой и наименее устоявшийся.</p>
    <p>Сжато: люди вас понимают, модели вас цитируют, агенты вас нанимают.</p>
  </div>

  <div class="term" id="method">
    <h2>6. Метод</h2>
    <p>Метод, которым я работаю, называется Legibility Sprint и опубликован как открытый протокол, а не продаётся как продукт. Его форма повторяет слои.</p>
    <p>Снять базовый замер до того, как что-либо менять, потому что изменение без состояния «до» не является доказательством. Привести собственное описание к одному предложению и выложить его дословно везде, где вы управляете, поскольку расхождение внутри собственных поверхностей это самая дешёвая в устранении и самая частая поломка. Добавить машиночитаемый слой. Публиковать рассуждение, стоящее за решениями, а не только исходы: публичная запись решений даёт системе то, что она может процитировать, когда спрашивают, кто разбирается в рынке. Дальше работать над подтверждением, это медленная часть и та, которая действительно двигает. Перезамерять с фиксированным интервалом по тем же вопросам.</p>
    <p>Полный протокол: <a href="/guides/sprint/">Sprint</a>. Словарь терминов: <a href="/ru/guides/dictionary/">словарь</a>.</p>
  </div>

  <div class="term" id="measurement">
    <h2>7. Измерение</h2>
    <p>У большинства публикуемых аудитов AI-видимости есть структурный дефект: в них нет негативного контроля. Термин запрашивают, выдачу наблюдают, результат приписывают проделанной работе. Но ничто в схеме не отличает настоящий сигнал от того, что та же процедура возвращает, когда искать нечего. Модели под неопределённостью порождают складный текст, поэтому отсутствие доказательства и доказательство отсутствия выглядят одинаково. Аудит без контроля нельзя опровергнуть, а неопровержимый аудит не является измерением.</p>
    <p>Исправление это контрольная группа. Рядом с настоящими терминами гоняется синтетический: выдуманная строка, которой нигде не существовало, введённая в известную дату и отслеживаемая по тому же расписанию. Она задаёт пол. То, что модели делают с термином, у которого доказуемо нет истории, и есть то, что процедура возвращает на пустоте. Метод я называю Synthetic Term Control.</p>
    <p>Минимум, который аудит должен опубликовать, чтобы его мог проверить кто-то другой: дословный набор промптов, использованные системы и версии моделей, даты прогонов, рынок и язык интерфейса, сырая выдача вместо её пересказа, и результат контроля рядом с результатом обработки. Всё, что меньше, это скриншот с приложенным выводом.</p>
    <p>Протокол и текущий контроль: <a href="/research/synthetic-term-control/">Synthetic Term Control</a>, зарегистрирован как препринт под <a href="https://doi.org/10.5281/zenodo.21840173">DOI 10.5281/zenodo.21840173</a>. Результаты публикуются в разделе <a href="/research/">Research</a> вместе с сырыми прогонами.</p>
  </div>

  <div class="term" id="limits">
    <h2>8. Чего этот документ не утверждает</h2>
    <p><strong>Уверенность неодинакова по слоям.</strong> Первый и второй опираются на устоявшуюся практику извлечения и структурированных данных. Третий опирается на разумный вывод о том, как системы взвешивают согласие между независимыми источниками, подкреплённый наблюдением, а не доступом к самим системам. Четвёртый ранний: протоколы есть, распространения пока нет.</p>
    <p><strong>Результаты привязаны к рынку и языку.</strong> Поведение моделей различается по языку интерфейса, региону, подключённому индексу извлечения и версии модели. Любая цифра из этой работы идёт с этими условиями или не значит ничего. Результат, наблюдаемый на одном языке, не переносится на другой.</p>
    <p><strong>Никаких причинных заявлений о ранжировании внутри моделей.</strong> Системы закрыты. Документировать можно то, что фиксированный промпт вернул в конкретную дату, и как это изменилось после конкретной работы, при сравнении с контролем. Это корреляция с датированным следом, и она стоит дороже, чем причинный язык, который обычно к ней прикладывают.</p>
    <p><strong>Соглашения остаются соглашениями, а не стандартами.</strong> Файлы вроде llms.txt это складывающаяся практика с частичным и непроверенным распространением, а не утверждённый стандарт. Относиться к ним стоит как к дешёвым, а не как к несущим.</p>
    <p><strong>Термин не заявляется как собственность.</strong> Словосочетание используют и другие. Здесь поддерживается конкретное, датированное, версионированное определение и привязанная к нему рамка.</p>
  </div>
