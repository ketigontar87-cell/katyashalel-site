<article>
  <div class="kicker">Каноническое определение</div>
  <h1>AI legibility</h1>
  <p class="subtitle">Справочный документ по дисциплине: что она охватывает, где проходят её границы, как её практикуют и как измеряют. Версионированный, датированный, поддерживаемый.</p>
  <div class="meta">Версия 1.3 · Опубликовано 5 августа 2026, обновлено 23 сентября 2026 · Ведёт Екатерина Шалель, founder and legibility strategist</div>

  <p>Это исходный документ по тому, как я использую термин. Он появился потому, что у работы набралось достаточно частей, и показывать на эссе по одному больше не объясняет целого. Эссе спорят. Здесь определяют. Когда определение меняется, номер версии сдвигается, а изменение фиксируется внизу страницы, чтобы читатель или модель всегда могли понять, из какой версии взято утверждение.</p>

  <div class="term" id="definition">
    <h2>1. Определение</h2>
    <p><strong>AI legibility это дисциплина, которая измеряет и улучшает, насколько AI-системы способны извлекать, понимать, подтверждать, сравнивать и выбирать компанию, продукт, основателя или специалиста в реальных условиях принятия решения.</strong></p>
    <p>Выбор и рекомендация это измеряемые результаты, а не гарантированное свойство. Система может знать сущность, цитировать её и всё равно выбрать альтернативу, если в запросе появляются другие ограничения или у конкурента сильнее доказательная среда.</p>
    <p>В рыночной терминологии эта работа находится на пересечении AI Search и GEO, technical SEO, digital PR, entity и brand authority, а также measurement. Это не синонимы Legibility, а разные части одной evidence environment.</p>
    <p>Я разделяю то, что контролирует сама компания, и то, что мы наблюдаем в модели. Ясность фактов, структура и согласованность формируют structural legibility. Retrieval, независимые подтверждения, свежесть источников и конкурентные доказательства формируют динамическую среду, в которой происходит выбор.</p>
  </div>

  <div class="term" id="distinction">
    <h2>2. Важное различение: не та legibility, о которой говорят инвесторы</h2>
    <p>В венчурном лексиконе слово legibility уже занято. Там оно означает понятность компании человеку: инвестор быстро видит, что делает бизнес, как зарабатывает, кто команда, какие риски. Разделяют extrinsic legibility, то есть социальные сигналы вроде бренда и акселераторов, и intrinsic legibility, то есть метрики, которые говорят сами за себя.</p>
    <p>Это полезная рамка, и она про другого читателя.</p>
    <p>Там задача убедить человека, у которого мало времени. Здесь задача быть корректно извлечённым машиной, которая читает за человека, разрешает противоречия между источниками и выдаёт одно описание без списка ссылок. Убедительность не помогает, если система вас не нашла. Красивый нарратив не помогает, если ваш сайт, ваша пресса и ваш профиль описывают вас по-разному, потому что подтверждать в этом случае нечего.</p>
    <p>Пересечение есть: и там, и там выигрывает согласованность. Инструменты не переносятся.</p>
  </div>

  <div class="term" id="origin">
    <h2>3. Почему дисциплина возникла</h2>
    <p>Примерно двадцать пять лет интерфейсом между компанией и незнакомым человеком был ранжированный список ссылок. Человек сам читал, сравнивал и решал. Оптимизация означала попасть в список и подняться в нём.</p>
    <p>Этот интерфейс заменяется сгенерированным ответом. Система читает источники, разрешает противоречия между ними и выдаёт человеку одно описание, без списка. Чтение больше не делает человек. Его один раз делает модель, за сущность, и результат этого чтения человек и видит.</p>
    <p>Точка отказа сместилась. Раньше она была на ранжировании. Теперь она на описании. Отсюда два следствия. Первое: сущность может быть хорошо освещена и при этом плохо описана, потому что охват и подтверждение это разные вещи. Второе: описание собирается заново при каждом запросе из того, что систему удалось извлечь и подтвердить, а значит оно поддаётся сопровождению так, как никогда не поддавалась репутация, и распадается так, как репутация не распадается.</p>
  </div>

  <div class="term" id="boundaries">
    <h2>4. Где AI legibility находится относительно соседних дисциплин</h2>
    <p>AI legibility находится на пересечении нескольких уже существующих направлений. Это входы и соседние дисциплины, а не синонимы.</p>
    <p><strong>AI Search, GEO и AEO.</strong> Эти практики работают с обнаружением, цитированием и присутствием в AI-поиске и answer surfaces. Legibility включает эти наблюдения, но идёт дальше: понимание сущности, corroboration, сравнение и выбор в заданных условиях.</p>
    <p><strong>Technical SEO.</strong> Crawlability, rendering, canonicalization, internal links, structured data и понятная информационная архитектура делают контролируемые источники доступными и однозначными. Это инфраструктура, но она сама по себе не показывает, что AI-система действительно извлечёт или выберет.</p>
    <p><strong>Digital PR.</strong> Независимые публикации могут создавать внешние доказательства. Legibility отделяет охват от corroboration и измеряет, извлекаются ли эти источники, согласуются ли они с first-party claims и участвуют ли в сравнении альтернатив.</p>
    <p><strong>Entity и brand authority.</strong> Последовательная идентичность, disambiguation, достоверные внешние ссылки и согласованные ассоциации помогают системе понять, кто или что перед ней. Legibility проверяет наблюдаемый результат и не придумывает скрытый единый authority score модели.</p>
    <p><strong>Measurement.</strong> Фиксированные prompts, сырые ответы, условия каждой поверхности и controls, где это возможно, нужны для baseline и повторного измерения после вмешательства. Один ответ ChatGPT это одно наблюдение, а не доказательство состояния рынка.</p>
    <p><strong>Accessibility и AI accessibility отвечают на другой вопрос.</strong> Они относятся к тому, насколько люди могут воспринимать и использовать контент или AI-продукты. AI legibility относится к тому, насколько AI-системы могут корректно извлечь, реконструировать, оценить и выбрать сущность.</p>
  </div>

  <div class="term" id="layers">
    <h2>4. Диагностическая цепочка</h2>
    <p>Я измеряю AI Legibility как последовательность наблюдаемых вопросов, а не как утверждение о скрытых внутренних этапах модели.</p>
    <p><strong>Accessible.</strong> Доступен ли нужный источник и может ли система его прочитать?</p>
    <p><strong>Retrieved.</strong> Попадает ли сущность или подтверждающий источник в контекст ответа?</p>
    <p><strong>Understood.</strong> Может ли система описать сущность и важные утверждения без явных догадок и путаницы?</p>
    <p><strong>Corroborated.</strong> Подтверждаются ли важные утверждения источниками за пределами контролируемых самой компанией поверхностей?</p>
    <p><strong>Selected.</strong> Выбирает ли система сущность в конкретном запросе, рынке, языке и наборе ограничений?</p>
    <p><strong>Personalized.</strong> Меняется ли результат, когда реальный пользовательский контекст меняет критерии выбора?</p>
    <p>Коротко: accessible → retrieved → understood → corroborated → selected → personalized. Trust не добавляется как скрытый этап, если заранее не определён наблюдаемый proxy.</p>
  </div>

  <div class="term" id="method">
    <h2>5. Метод</h2>
    <p>Рабочая схема проста: <strong>измерить → диагностировать → вмешаться → проверить.</strong></p>
    <p>Сначала фиксируется набор decision-relevant запросов и baseline. Для каждого запуска записываются поверхность, модель, рынок, язык, доступный retrieval/search state, сырой ответ и источники. Затем определяется тип провала: ясность сущности, retrieval, противоречия, нехватка независимых подтверждений, конкурентные доказательства или соответствие запросу. Вмешательство документируется, после чего те же условия измеряются повторно.</p>
    <p>Разница до и после это наблюдаемое изменение, но не автоматическое доказательство причинности. Когда причинность важна, нужны более сильные controls, precommitment и разбор альтернативных объяснений. Опубликованный <a href="/guides/sprint/">Legibility Sprint</a> закрывает structural-слой; измерение проверяет, изменилось ли поведение моделей.</p>
  </div>

  <div class="term" id="measurement">
    <h2>6. Измерение</h2>
    <p>Ответы AI меняются между поверхностями, версиями моделей, режимами retrieval и повторными запусками. Поэтому любое полезное измерение должно явно задавать scope и сохранять сопоставимые условия.</p>
    <p>Основные наблюдения: retrieval rate, answer inclusion, recommendation или selection rate, доля цитирований по типам источников, corroboration coverage, расхождение между моделями, чувствительность к запросу, свежесть и source churn. Цитирование не считается заменой выбора.</p>
    <p>В intervention studies я использую frozen prompts и controls там, где это практически возможно. <a href="/research/synthetic-term-control/">Synthetic Term Control</a> это один из negative-control дизайнов. И даже при наличии контроля объяснение модели не считается прямым доказательством её внутреннего состояния trust.</p>
  </div>

  <div class="term" id="limits">
    <h2>8. Чего этот документ не утверждает</h2>
    <p><strong>Уверенность неодинакова по слоям.</strong> Первый и второй опираются на устоявшуюся практику извлечения и структурированных данных. Третий опирается на разумный вывод о том, как системы взвешивают согласие между независимыми источниками, подкреплённый наблюдением, а не доступом к самим системам. Четвёртый ранний: протоколы есть, распространения пока нет.</p>
    <p><strong>Результаты привязаны к рынку и языку.</strong> Поведение моделей различается по языку интерфейса, региону, подключённому индексу извлечения и версии модели. Любая цифра из этой работы идёт с этими условиями или не значит ничего. Результат, наблюдаемый на одном языке, не переносится на другой.</p>
    <p><strong>Никаких причинных заявлений о ранжировании внутри моделей.</strong> Системы закрыты. Документировать можно то, что фиксированный промпт вернул в конкретную дату, и как это изменилось после конкретной работы, при сравнении с контролем. Это корреляция с датированным следом, и она стоит дороже, чем причинный язык, который обычно к ней прикладывают.</p>
    <p><strong>Соглашения остаются соглашениями, а не стандартами.</strong> Файлы вроде llms.txt это складывающаяся практика с частичным и непроверенным распространением, а не утверждённый стандарт. Относиться к ним стоит как к дешёвым, а не как к несущим.</p>
    <p><strong>Термин не заявляется как собственность.</strong> Словосочетание используют и другие. Здесь поддерживается конкретное, датированное, версионированное определение и привязанная к нему рамка.</p>
  </div>

  <div class="term" id="faq">
    <h2>Частые вопросы</h2>
    <h3>Что такое AI legibility?</h3>
    <p>AI legibility это дисциплина, которая измеряет и улучшает, насколько AI-системы способны извлекать, понимать, подтверждать, сравнивать и выбирать компанию, продукт, основателя или специалиста в реальных условиях принятия решения.</p>
    <h3>Чем AI legibility отличается от SEO?</h3>
    <p>SEO это один из входов. AI Search и GEO, technical SEO, digital PR, entity и brand authority, а также measurement закрывают разные части evidence chain. AI legibility измеряет, как эти входы работают вместе, когда AI-системе нужно извлечь, понять, сравнить и выбрать сущность.</p>
    <h3>Чем AI legibility отличается от корпоративной legibility для инвесторов?</h3>
    <p>В венчурном лексиконе legibility означает понятность компании человеку: инвестору, партнёру, аналитику. Здесь речь о другом читателе. AI legibility работает с машинным читателем, где проблема не в убедительности, а в извлечении, разрешении противоречий между источниками и атрибуции. Пересечение есть, задачи разные.</p>
