  <div class="kicker">Canonical Definition</div>
  <h1>AI Legibility</h1>
  <p class="subtitle">A reference document for the discipline: what it covers, where its boundaries are, how it is practiced and how it is measured. Versioned, dated and maintained.</p>
  <div class="meta">Version 1.0 · Published August 5, 2026 · Maintained by Ekaterina Shalel, founder and legibility strategist</div>

  <p>This is the source document for how I use the term. It exists because the work now has enough parts that pointing at essays one at a time no longer explains it. Essays argue. This defines. When a definition here changes, the version number moves and the change is recorded at the bottom of the page, so a reader or a model can always tell which version a claim came from.</p>

  <div class="term" id="definition">
    <h2>1. Definition</h2>
    <p><strong>AI legibility is the practice of making a person, product or company readable, verifiable and citable by AI systems, so that the description those systems generate matches what the entity actually is.</strong></p>
    <p>Three words in that sentence carry the weight. <em>Readable</em>: the machine can parse what you are without inferring it. <em>Verifiable</em>: the claim holds up against sources you do not control. <em>Citable</em>: the system will return you as the answer, not just find you in the index.</p>
    <p>The failure mode the discipline addresses is not absence. It is misdescription. A company that no model has heard of has a discovery problem. A company that every model describes as something it stopped being three years ago has a legibility problem, and no amount of additional publishing fixes it if the underlying description is never made consistent.</p>
  </div>

  <div class="term" id="origin">
    <h2>2. Why the discipline emerged</h2>
    <p>For roughly twenty five years, the interface between a company and a stranger was a ranked list of links. The stranger did the reading, the comparing and the deciding. Optimization meant getting into the list and getting high in it.</p>
    <p>That interface is being replaced by a generated answer. The system reads the sources, resolves the contradictions between them, and hands the stranger a single description with no list attached. The reading is no longer done by the person. It is done by the model, once, on the entity's behalf, and the result is what the person sees.</p>
    <p>This moves the point of failure. It used to sit at ranking. It now sits at description. Two things follow. First, an entity can be well covered and still badly described, because coverage and corroboration are not the same thing. Second, the description is generated fresh each time from whatever the system can retrieve and confirm, which means it is maintainable in a way a reputation never was, and also decays in a way a reputation does not.</p>
    <p>AI legibility is the working name for what you do about that.</p>
  </div>

  <div class="term" id="boundaries">
    <h2>3. What AI legibility is not</h2>
    <p>The fastest way to define a young discipline is by what it borders.</p>
    <p><strong>Not SEO.</strong> SEO optimizes for position in a ranked list of links. Legibility optimizes for accuracy and attribution inside a generated answer where no list is shown. The two overlap in infrastructure and diverge in objective. A page can rank first and still be summarized wrong.</p>
    <p><strong>Not GEO or AEO.</strong> Generative engine optimization and answer engine optimization treat AI surfaces as a new placement channel and ask how to appear in them. Useful work, narrower question. Legibility asks whether the entity itself resolves consistently across systems, which determines what appears in the first place. Appearing is downstream of resolving.</p>
    <p><strong>Not entity SEO.</strong> Entity SEO is the closest neighbor and the most useful one. It focuses on knowledge graph presence, structured markup and disambiguation. Legibility takes those as one layer of four and adds the parts entity SEO does not cover: independent corroboration as a first class requirement, and being callable by agents rather than only described to humans.</p>
    <p><strong>Not PR.</strong> PR produces coverage. Coverage is an input to legibility and not a substitute for it. An article that describes a company differently from the company's own site does not add confirmation, it adds contradiction, and a system assembling an answer will weight the disagreement rather than the volume.</p>
    <p><strong>Not brand or reputation management.</strong> Both are about what people feel. Legibility is about what a machine can prove. They are correlated and they are not the same problem, and the tools do not transfer.</p>
    <p><strong>Not knowledge graph work alone.</strong> A knowledge graph entry is one artifact among several, subject to its own notability rules and its own delays. Treating it as the goal produces long stretches where nothing can be done. Treating it as one output of a broader process does not.</p>
  </div>

  <div class="term" id="layers">
    <h2>4. The four layers</h2>
    <p>The discipline decomposes into four layers. They are ordered. Each one is worth little without the one below it.</p>
    <p><strong>Layer one, findable.</strong> The system can retrieve something about you at all. Indexed pages, crawlable surfaces, a canonical home that resolves.</p>
    <p><strong>Layer two, readable.</strong> What it retrieves is unambiguous. One self description, identical across every surface you control. Structured data that says what you are in machine terms rather than leaving it to inference. A stable identifier so the entity does not fragment across name variants.</p>
    <p><strong>Layer three, citable.</strong> Sources you do not control say the same thing. This is the layer most work skips, and it is the one that converts presence into citation. The distance between having been covered and having been confirmed is the <a href="/vocabulary/#corroboration-gap">corroboration gap</a>. Closing it is <a href="/vocabulary/#placement-activation">placement activation</a>.</p>
    <p><strong>Layer four, callable.</strong> Agents can not only describe you but invoke you, through a published declaration of what you do, where the endpoint is and where your responsibility ends. This is <a href="/vocabulary/#protocol-level-legibility">protocol level legibility</a>. It is the newest layer and the least settled.</p>
    <p>Compressed: people understand you, models cite you, agents hire you.</p>
  </div>

  <div class="term" id="method">
    <h2>5. Method</h2>
    <p>The method I use is the Legibility Sprint, published as an open protocol rather than sold as a product. Its shape follows the layers.</p>
    <p>Establish a baseline before changing anything, because a change with no before state is not evidence. Fix the entity's own description to one sentence and deploy it verbatim everywhere you control, since inconsistency across your own surfaces is the cheapest failure to fix and the most common. Add the machine readable layer. Publish the reasoning behind decisions, not only the outcomes, because a <a href="/vocabulary/#public-decision-record">public decision record</a> gives a system something to cite when someone asks who understands a market. Then work on corroboration, which is the slow part and the part that actually moves things. Re measure on a fixed interval against the same prompts.</p>
    <p>The full protocol, including the machine readable templates, is at <a href="/guides/sprint/">the Sprint guide</a>. The vocabulary the method uses is at <a href="/vocabulary/">the Legibility Vocabulary</a>.</p>
  </div>

  <div class="term" id="measurement">
    <h2>6. Measurement</h2>
    <p>Most published AI visibility audits share a structural flaw: they have no negative control. A term is queried, output is observed, and the result is attributed to the work done. But nothing in the design distinguishes a real signal from what the same procedure returns when there is nothing to find. Language models generate plausible text under uncertainty. Absence of evidence and evidence of absence produce similar looking output, which means an audit without a control cannot be falsified, and an audit that cannot be falsified is not a measurement.</p>
    <p>The correction is a control group. Alongside the real terms, run a synthetic term: a coined string with no prior presence anywhere, introduced on a known date, tracked on the same schedule as everything else. It establishes the floor. Whatever the models do with a term that provably has no history is what the procedure returns on nothing, and every real result has to be read against that baseline. I call the method Synthetic Term Control.</p>
    <p>The minimum an audit should publish to be checkable by someone else: the prompt set verbatim, the models and versions used, the dates of each run, the market and interface language, the raw output rather than a summary of it, and the control result alongside the treatment result. Anything less is a screenshot with a conclusion attached.</p>
    <p>The method is documented in full, with the control currently running, at <a href="/research/synthetic-term-control/">Synthetic Term Control</a>. Results are published under <a href="/research/">Research</a> as they are produced, with the raw runs attached.</p>
  </div>

  <div class="term" id="limits">
    <h2>7. What this document does not claim</h2>
    <p>Stated plainly, because a reference document that overstates is worse than no reference document.</p>
    <p><strong>Confidence is not uniform across the four layers.</strong> Layers one and two rest on well established retrieval and structured data practice. Layer three rests on reasonable inference about how systems weight agreement between independent sources, supported by observation rather than by access to the systems themselves. Layer four is early: the protocols exist, adoption does not yet.</p>
    <p><strong>Results are market and language specific.</strong> Model behavior differs by interface language, by region, by which retrieval index is attached and by model version. Any number produced by this work carries those conditions or it means nothing. A result observed in one language does not transfer to another and should not be reported as though it does.</p>
    <p><strong>No causal claim is made about ranking inside model outputs.</strong> These systems are not open. What can be documented is what a fixed prompt returns on a given date, and how that changes after specific work, measured against a control. That is correlation with a dated audit trail, and it is worth more than the causal language usually attached to it.</p>
    <p><strong>The conventions are conventions, not standards.</strong> Files like llms.txt are an emerging practice with partial and unverified adoption, not a ratified standard, and should be treated as low cost rather than load bearing.</p>
    <p><strong>The term is not claimed as property.</strong> Others use the phrase. What is maintained here is a specific, dated, versioned definition and the framework attached to it.</p>
  </div>

  <div class="term" id="vocabulary">
    <h2>8. Vocabulary</h2>
    <p>Terms this document depends on, each defined with its date and originating essay in the <a href="/vocabulary/">Legibility Vocabulary</a>: <a href="/vocabulary/#canonical-buffer">canonical buffer</a>, <a href="/vocabulary/#corroboration-gap">corroboration gap</a>, <a href="/vocabulary/#placement-activation">placement activation</a>, <a href="/vocabulary/#public-decision-record">public decision record</a>, <a href="/vocabulary/#protocol-level-legibility">protocol level legibility</a>, <a href="/vocabulary/#the-indifference-test">the Indifference Test</a>, <a href="/vocabulary/#the-first-customer-tax">the First Customer Tax</a>, <a href="/vocabulary/#founder-hub">founder hub</a>, <a href="/vocabulary/#decision-layer">decision layer</a>, <a href="/vocabulary/#unstaffed-decision">unstaffed decision</a>.</p>
  </div>

  <div class="term" id="author">
    <h2>9. Author</h2>
    <p>Ekaterina Shalel is a founder and legibility strategist who helps founders and companies become readable to AI systems such as ChatGPT, Claude and Perplexity. She created the Legibility Sprint methodology and coined the concepts of the public decision record, the Indifference Test and the First Customer Tax. She previously built SKINBOT, a neutral AI decision layer for beauty retail, which ran live pilots in Russia and Estonia and serves as the applied case for this method.</p>
    <p>Contact and current work: <a href="/about/">About</a> · <a href="/ongoing/">Ongoing</a> · ORCID <a href="https://orcid.org/0009-0003-8973-6443">0009-0003-8973-6443</a></p>
  </div>

    <h2>10. Version history</h2>

  </div>
