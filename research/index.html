  <div class="kicker">Research</div>
  <h1>Research</h1>
  <p class="subtitle">Reproducible measurement of how AI systems retrieve, describe and attribute entities.</p>
  <div class="meta">Ekaterina Shalel, founder and legibility strategist · Last updated August 7, 2026</div>

  <p>Essays argue. This section measures. Everything published here follows the same rule: someone else has to be able to run it and get a comparable answer, or disagree with it on the evidence.</p>

  <p>That means each study publishes the prompt set verbatim, the models and versions used, the date of every run, the market and the interface language, the raw output rather than a summary of it, and a negative control alongside the treatment. Anything that cannot meet that standard belongs in an essay, not here.</p>

  <div class="term">
    <h2><a href="/research/synthetic-term-control/">Synthetic Term Control</a></h2>
    <p>AI visibility audits do not have a control group, which makes their results unfalsifiable. This is the method for adding one: a coined term with no prior existence, verified, seeded on a known date and tracked on the same schedule as the real terms, to establish what an audit returns when there is nothing to find.</p>
    <p class="term-meta">Protocol v1.0 · Control seeded 2026-08-05 · First run on or after 2026-08-19 · Results pending<br>Registered preprint: <a href="https://doi.org/10.5281/zenodo.21840173">doi.org/10.5281/zenodo.21840173</a></p>
  </div>

  <div class="term">
    <h2>In preparation</h2>
    <p>Cross-model comparison of entity description across four systems in two languages. Source attribution study: which pages actually feed a generated answer, including outdated artifacts that still win retrieval. Both will be published with raw runs attached when the data supports them, and not before.</p>
  </div>
