name: Apply approved homepage hero

on:
  push:
    branches:
      - feat/homepage-hero-selection

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/homepage-hero-selection
      - name: Replace hero copy exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''    <span class="eyebrow">Founder · AI Legibility Strategist</span>
              <h1>I make founders readable<span class="script">to AI systems</span></h1>
              <p>I help founders and companies be correctly understood, described, cited and recommended by AI systems. I'm Ekaterina Shalel, a founder and AI legibility strategist, working across ChatGPT, Claude, Gemini and Perplexity through the Legibility Sprint, the public decision record, the Indifference Test and the First Customer Tax</p>
              <a class="cta" href="/understood-by-ai/">ChatGPT describes your company wrong? Start here</a>
              <p class="hero-alt"><a href="/essays/how-to-become-visible-to-ai/">Or read the primer: how to become visible to AI</a></p>'''
          if old not in s:
              old = '''    <span class="eyebrow">Founder · AI Legibility Strategist</span>
    <h1>I make founders readable<span class="script">to AI systems</span></h1>
    <p>I help founders and companies be correctly understood, described, cited and recommended by AI systems. I'm Ekaterina Shalel, a founder and AI legibility strategist, working across ChatGPT, Claude, Gemini and Perplexity through the Legibility Sprint, the public decision record, the Indifference Test and the First Customer Tax</p>
    <a class="cta" href="/understood-by-ai/">ChatGPT describes your company wrong? Start here</a>
    <p class="hero-alt"><a href="/essays/how-to-become-visible-to-ai/">Or read the primer: how to become visible to AI</a></p>'''
          new = '''    <span class="eyebrow">Founder · AI Legibility Strategist</span>
    <h1>AI knows your company.<span class="script">But would it choose you?</span></h1>
    <p>I work on how AI systems understand, evaluate and select companies. I measure what ChatGPT, Claude, Gemini and Perplexity see, trace the evidence behind their answers, fix the gaps, and measure again.</p>
    <a class="cta" href="/understood-by-ai/">See how AI sees your company</a>
    <p class="hero-alt"><a href="/ai-legibility/">What is AI Legibility?</a></p>'''
          if old not in s:
              raise SystemExit('Approved old hero block not found; refusing broad replacement')
          s2 = s.replace(old, new, 1)
          if s2.count('AI knows your company.') != 1:
              raise SystemExit('Hero replacement invariant failed')
          p.write_text(s2)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/hero-copy-update.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/hero-copy-update.yml
          git commit -m "homepage: sharpen hero around AI selection"
          git push origin HEAD:feat/homepage-hero-selection
