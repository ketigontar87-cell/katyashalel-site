name: IndexNow ping

# Submits every URL in the live sitemap to IndexNow after each deploy.
# Fails loudly: a rejected submission must not report as a green run.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the deploy to go live
        run: sleep 90

      - name: Submit sitemap URLs to IndexNow
        env:
          HOST: katyashalel.com
          KEY: 9656a8346f4b4450826617d677d759d8
        run: |
          set -euo pipefail

          # Read the deployed sitemap, not the one in the repo: if the deploy
          # failed, the submission should reflect what is actually live.
          curl -sS --fail --retry 3 --retry-delay 10 \
            "https://${HOST}/sitemap.xml" -o sitemap.xml

          grep -oP '(?<=<loc>)[^<]+' sitemap.xml > urls.txt
          count=$(wc -l < urls.txt)
          echo "Found ${count} URLs."
          if [ "$count" -eq 0 ]; then
            echo "Sitemap parsed to zero URLs."; exit 1
          fi

          # Without a reachable key file the engines reject the whole batch.
          served=$(curl -sS --fail "https://${HOST}/${KEY}.txt" | tr -d '[:space:]')
          if [ "$served" != "$KEY" ]; then
            echo "Key file mismatch. Served: '${served}'"; exit 1
          fi
          echo "Key file verified."

          jq -n \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg loc "https://${HOST}/${KEY}.txt" \
            --rawfile urls urls.txt \
            '{host:$host, key:$key, keyLocation:$loc,
              urlList: ($urls | split("\n") | map(select(length>0)))}' \
            > payload.json

          code=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/IndexNow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @payload.json)

          echo "IndexNow responded ${code}"
          cat response.txt || true

          # 200 accepted, 202 accepted pending key validation.
          case "$code" in
            200|202) echo "Submitted ${count} URLs." ;;
            *) echo "IndexNow rejected the submission."; exit 1 ;;
          esac