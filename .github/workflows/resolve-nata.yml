name: Resolve Nata chat id
on:
  workflow_dispatch: {}
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Find Nata private chat, store secret, confirm
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          pip install --quiet pynacl requests
          python3 - << 'PYEOF'
          import os, json, base64, requests
          TG = os.environ["TG_BOT_TOKEN"]; GH = os.environ["GH_ADMIN_TOKEN"]; KETI = os.environ["TG_CHAT_ID"]
          REPO = "ketigontar87-cell/katyashalel-site"
          upd = requests.get(f"https://api.telegram.org/bot{TG}/getUpdates?limit=100").json()
          assert upd.get("ok"), f"getUpdates failed: {upd}"
          nata = None
          for u in upd["result"]:
              m = u.get("message") or {}
              c = m.get("chat", {})
              if c.get("type") == "private" and (c.get("username") or "").lower() == "nata_blondie":
                  nata = c
          assert nata, "NATA_NOT_FOUND"
          chat_id = str(nata["id"])
          print("found:", nata.get("first_name",""), "masked id:", chat_id[:3]+"***")
          h = {"Authorization": f"Bearer {GH}", "Accept": "application/vnd.github+json"}
          from nacl import encoding, public
          key = requests.get(f"https://api.github.com/repos/{REPO}/actions/secrets/public-key", headers=h).json()
          sealed = public.SealedBox(public.PublicKey(key["key"].encode(), encoding.Base64Encoder())).encrypt(chat_id.encode())
          r = requests.put(f"https://api.github.com/repos/{REPO}/actions/secrets/TG_CHAT_ID_2", headers=h,
              json={"encrypted_value": base64.b64encode(sealed).decode(), "key_id": key["key_id"]})
          print("secret TG_CHAT_ID_2:", r.status_code)
          for cid, txt in [(chat_id, "\u2705 \u0412\u044b \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0435\u043d\u044b \u043a \u0443\u0432\u0435\u0434\u043e\u043c\u043b\u0435\u043d\u0438\u044f\u043c \u043f\u043e\u0447\u0442\u044b skinbot.ru. \u041d\u043e\u0432\u044b\u0435 \u043f\u0438\u0441\u044c\u043c\u0430 \u0431\u0443\u0434\u0443\u0442 \u043f\u0440\u0438\u0445\u043e\u0434\u0438\u0442\u044c \u0441\u044e\u0434\u0430."), (KETI, "\u2705 \u041d\u0430\u0442\u0430\u0448\u0430 (@Nata_Blondie) \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0435\u043d\u0430 \u043a \u0443\u0432\u0435\u0434\u043e\u043c\u043b\u0435\u043d\u0438\u044f\u043c \u043f\u043e\u0447\u0442\u044b.")]:
              requests.post(f"https://api.telegram.org/bot{TG}/sendMessage", data={"chat_id": cid, "text": txt})
          PYEOF
