name: Resolve TG chat id
on:
  workflow_dispatch: {}
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Find private chat, store secret, send test
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          pip install --quiet pynacl requests
          python3 - << 'PYEOF'
          import os, json, base64, requests
          from nacl import encoding, public
          TG = os.environ["TG_BOT_TOKEN"]; GH = os.environ["GH_ADMIN_TOKEN"]
          REPO = "ketigontar87-cell/katyashalel-site"
          upd = requests.get(f"https://api.telegram.org/bot{TG}/getUpdates?limit=100").json()
          assert upd.get("ok"), f"getUpdates failed: {upd}"
          chats = {}
          for u in upd["result"]:
              m = u.get("message") or {}
              c = m.get("chat", {})
              if c.get("type") == "private":
                  chats[c["id"]] = c.get("first_name", "")
          assert chats, "No private chat found. The user must message the bot first."
          chat_id = str(sorted(chats.keys())[-1])
          print("found private chat (masked):", chat_id[:3] + "***")
          h = {"Authorization": f"Bearer {GH}", "Accept": "application/vnd.github+json"}
          key = requests.get(f"https://api.github.com/repos/{REPO}/actions/secrets/public-key", headers=h).json()
          sealed = public.SealedBox(public.PublicKey(key["key"].encode(), encoding.Base64Encoder())).encrypt(chat_id.encode())
          r = requests.put(f"https://api.github.com/repos/{REPO}/actions/secrets/TG_CHAT_ID", headers=h,
              json={"encrypted_value": base64.b64encode(sealed).decode(), "key_id": key["key_id"]})
          print("secret TG_CHAT_ID:", r.status_code)
          t = requests.post(f"https://api.telegram.org/bot{TG}/sendMessage",
              data={"chat_id": chat_id, "text": "\u2705 \u041f\u043e\u0447\u0442\u043e\u0432\u044b\u0439 \u043c\u043e\u043d\u0438\u0442\u043e\u0440\u0438\u043d\u0433 skinbot.ru \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0451\u043d. \u041d\u043e\u0432\u044b\u0435 \u043f\u0438\u0441\u044c\u043c\u0430 \u0431\u0443\u0434\u0443\u0442 \u043f\u0440\u0438\u0445\u043e\u0434\u0438\u0442\u044c \u0441\u044e\u0434\u0430 \u0432 \u0442\u0435\u0447\u0435\u043d\u0438\u0435 15 \u043c\u0438\u043d\u0443\u0442."})
          print("test message:", t.json().get("ok"))
          PYEOF
