name: Execute canonical definition polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Run polish
        run: python .github/scripts/final_definition_polish.py
      - name: Commit and remove temporary runner
        run: |
          git config user.name "Ekaterina Shalel"
          git config user.email "shalelekaterina@gmail.com"
          git rm .github/scripts/final_definition_polish.py .github/workflows/final-definition-polish.yml
          git add ai-legibility/index.html ru/ai-legibility/index.html
          git diff --cached --check
          git commit -m "site: polish canonical definition v1.2"
          git push origin HEAD:main
