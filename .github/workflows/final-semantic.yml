name: Execute final semantic cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Run cleanup
        run: python .github/scripts/final_semantic_cleanup.py
      - name: Commit cleanup and remove temporary runner
        run: |
          git config user.name "Ekaterina Shalel"
          git config user.email "shalelekaterina@gmail.com"
          git rm .github/scripts/final_semantic_cleanup.py .github/workflows/final-semantic.yml
          git add index.html brands/index.html audit/index.html ai-legibility/index.html ru/ai-legibility/index.html
          git diff --cached --check
          git commit -m "site: align canonical definition and services"
          git push origin HEAD:main
